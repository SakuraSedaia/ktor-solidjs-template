default:
  image: eclipse-temurin:21-jdk
  interruptible: true

stages:
  - verify
  - release

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-user-home"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

cache:
  key:
    files:
      - gradle/libs.versions.toml
      - src/main/solidjs/pnpm-lock.yaml
  paths:
    - .gradle-user-home/caches/
    - .gradle-user-home/wrapper/
    - .gradle/nodejs/
    - .gradle/pnpm/

build-and-test:
  stage: verify
  timeout: 20 minutes
  script:
    - ./gradlew build --no-daemon --stacktrace
    - |
      PROJECT_VERSION="$(./gradlew properties --quiet | sed -n 's/^version: //p')"
      RELEASE_VERSION="${PROJECT_VERSION%-SNAPSHOT}"
      printf 'PROJECT_VERSION=%s\nRELEASE_VERSION=%s\nRELEASE_TAG=v%s\n' \
        "$PROJECT_VERSION" "$RELEASE_VERSION" "$RELEASE_VERSION" > build/release.env
      awk -v heading="## [$RELEASE_VERSION]" '
        index($0, heading) == 1 { found = 1; next }
        found && /^## \[/ { exit }
        found && /^\[[^]]+\]: / { exit }
        found { print }
      ' CHANGELOG.md > build/release-notes.md
      test -s build/release-notes.md
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: build/test-results/test/*.xml
      dotenv: build/release.env
    paths:
      - build/reports/tests/test/
      - build/distributions/
      - build/release-notes.md

publish-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: build-and-test
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - |
      RELEASE_ASSET="build/distributions/ktor-solidjs-template-shadow-${PROJECT_VERSION}.zip"
      test -f "$RELEASE_ASSET"
      glab release create "$RELEASE_TAG" \
        --name "Ktor + SolidJS Template ${RELEASE_TAG}" \
        --notes-file build/release-notes.md \
        --ref "$CI_COMMIT_SHA" \
        "$RELEASE_ASSET" \
        --use-package-registry
